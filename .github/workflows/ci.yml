name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-refs:
    name: Validate ws:// refs against AIP-54
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Every ws:// collection has a row in AIP-54 §Reference syntax
        # The table in aip-54.mdx is the fixture — the script parses it out
        # of the spec, so this can never drift from what the spec says.
        # (Lived in AIP-27 until #29 superseded it and moved the scheme.)
        run: node scripts/check-refs.mjs .

  check-mdx-safe:
    name: Specs are MDX-parseable
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: No HTML comments or autolinks in specs/*.mdx
        # agentproto.sh mirrors specs/*.mdx and compiles it with
        # fumadocs-mdx, which is stricter than CommonMark about `<`. A
        # single `<https://…>` autolink in aip-49.mdx broke that site's
        # production build for five weeks with nothing red over here.
        run: node scripts/check-mdx-safe.mjs .

  check-aip-refs:
    name: Validate inter-AIP references
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Every requires:/link/ref-impl/package reference resolves
        # NON-BLOCKING on purpose: the corpus is clean today, so anything
        # this reports is fresh breakage. Flips to blocking once the
        # findings it reports are fixed in follow-up PRs — a link fix must
        # be reviewable on its own. (The ref-impl/package rules skip when
        # no ts checkout sits alongside, which is always true here.)
        continue-on-error: true
        run: node scripts/check-aip-refs.mjs .

  check-spec-json:
    name: Spec JSON parses
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Every specs/**/*.json parses
        # A dropped `},` left HARNESS.schema.json invalid on main because
        # nothing parsed the schemas. Parse only: compiling them needs a
        # validator dependency this repo does not carry.
        run: node scripts/check-spec-json.mjs .

  check-names:
    name: Canonical names (AIP-70)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: The check catches what it claims to catch
        run: node scripts/self-test-names.mjs

      - name: Every AIP matches specs/names.json, or its deviation is pending
        # Ratchet: a deviation missing from `pending` fails (new drift), and
        # a pending id that no longer deviates fails too (remove it, so the
        # fix cannot be undone silently).
        run: node scripts/check-names.mjs .

  lint-specs:
    name: Lint AIP frontmatter
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify every spec has required frontmatter
        run: |
          set -e
          fail=0
          for f in specs/aip-*.mdx; do
            # Required on every spec.
            for key in aip title status type created; do
              if ! grep -qE "^${key}:" "$f"; then
                echo "::error file=$f::missing frontmatter key '$key'"
                fail=1
              fi
            done
            # Authorship: either a single `author:` (own work), or both
            # `spec-author:` + `aip-editor:` (external spec adapted into AIP).
            if ! grep -qE "^author:" "$f"; then
              if ! { grep -qE "^spec-author:" "$f" && grep -qE "^aip-editor:" "$f"; }; then
                echo "::error file=$f::missing 'author' (or 'spec-author' + 'aip-editor' pair)"
                fail=1
              fi
            fi
          done
          exit $fail
